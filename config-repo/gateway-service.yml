server:
  port: 8888
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: http://localhost:4200
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: '*'
